    <!-- OpenGraph / Twitter — for link previews when someone shares
         https://t.me/ivannikovProBot/app or https://tg.ivannikov.pro. -->

    <meta
      property="og:description"
      content="Premium engineering — AI, B2B SaaS, Web3. Briefs, projects, invoices and a direct line — in one place."

    <!-- Favicons (same set as ivannikov.pro). The mini-app itself runs
         inside Telegram chrome where these aren't rendered, but a
         direct-browser hit (e.g. someone testing tg.ivannikov.pro)
         picks them up. -->
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="icon" href="/favicon-16x16.png" sizes="16x16" type="image/png" />
    <link rel="icon" href="/favicon-32x32.png" sizes="32x32" type="image/png" />
    <link rel="icon" href="/favicon-96x96.png" sizes="96x96" type="image/png" />
    <link rel="icon" href="/android-icon-192x192.png" sizes="192x192" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-icon-180x180.png" sizes="180x180" />

    <!-- Telegram WebApp SDK. Loaded synchronously before our bundle so
         `window.Telegram.WebApp` exists at React mount time — no race.
         Mini app loads only inside a Telegram client; if you somehow
         open this URL directly, the script no-ops gracefully. -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <!-- <script src="https://tg.ivannikov.pro/js/telegram-web-app.js"></script> -->

    <!-- Anti-flash theme bootstrap. Surface CSS keys off `data-theme`
         on <html>; if the SDK is here, lift colour scheme from it
         before first paint. Outside Telegram we fall back to system
         preference, then to dark. -->
    <script>
      (function () {
        try {
          var tg = window.Telegram && window.Telegram.WebApp;
          var theme;
          if (tg && tg.colorScheme) {
            theme = tg.colorScheme;
          } else if (window.matchMedia("(prefers-color-scheme: dark)").matches) {
            theme = "dark";
          } else {
            theme = "light";
          }
          document.documentElement.setAttribute("data-theme", theme);
        } catch (e) {
          document.documentElement.setAttribute("data-theme", "dark");
        }
      })();
    </script>
